<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-label="運作方式共四步：你跟 Claude 說想看的東西；Claude 請一個小幫手去查；小幫手用你自己的通行證登入 GitLab，所以只會看到你自己的專案，不是公司共用帳號那份；最後把結果整理成看得懂的樣子給你。如果還沒設定通行證，會提醒你要先申請一組只能看、不能改的通行證">
  <defs>
    <marker id="arrowMain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a2620"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b9782e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="340" fill="#f5f2ea"/>

  <g font-family="'Noto Sans TC',sans-serif">
    <!-- step 1 -->
    <rect x="15" y="100" width="215" height="86" rx="12" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
    <circle cx="40" cy="120" r="13" fill="#2a2620"/>
    <text x="40" y="125" text-anchor="middle" fill="#f5f2ea" font-weight="700" font-size="13">1</text>
    <text x="122" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2a2620">你跟 Claude 說想看什麼</text>
    <text x="122" y="157" text-anchor="middle" font-size="10" fill="#6b6558">例如「幫我看看 OO 專案</text>
    <text x="122" y="171" text-anchor="middle" font-size="10" fill="#6b6558">最近改了什麼」</text>

    <!-- step 2 -->
    <rect x="260" y="100" width="200" height="86" rx="12" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
    <circle cx="285" cy="120" r="13" fill="#2a2620"/>
    <text x="285" y="125" text-anchor="middle" fill="#f5f2ea" font-weight="700" font-size="13">2</text>
    <text x="360" y="142" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2a2620">Claude 請小幫手去查</text>
    <text x="360" y="163" text-anchor="middle" font-family="'IBM Plex Mono',sans-serif" font-size="9.5" fill="#6b6558">gitlab-mcp</text>

    <!-- step 3 (accent, emphasized) -->
    <rect x="495" y="82" width="255" height="122" rx="12" fill="#dbe9ea" stroke="#2b6777"/>
    <circle cx="520" cy="102" r="13" fill="#17414c"/>
    <text x="520" y="107" text-anchor="middle" fill="#dbe9ea" font-weight="700" font-size="13">3</text>
    <text x="628" y="126" text-anchor="middle" font-size="13.5" font-weight="700" fill="#17414c">用「你自己的」通行證登入</text>
    <text x="628" y="148" text-anchor="middle" font-size="11" fill="#17414c">看到的只有你自己的專案</text>
    <text x="628" y="166" text-anchor="middle" font-size="11" fill="#17414c">不是公司共用帳號那份</text>
    <text x="628" y="185" text-anchor="middle" font-family="'IBM Plex Mono',sans-serif" font-size="9" fill="#17414c" opacity="0.75">Personal Access Token</text>

    <!-- step 4 -->
    <rect x="785" y="100" width="200" height="86" rx="12" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
    <circle cx="810" cy="120" r="13" fill="#2a2620"/>
    <text x="810" y="125" text-anchor="middle" fill="#f5f2ea" font-weight="700" font-size="13">4</text>
    <text x="885" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2a2620">整理成看得懂的樣子</text>
    <text x="885" y="157" text-anchor="middle" font-size="10" fill="#6b6558">分支、修改紀錄、</text>
    <text x="885" y="171" text-anchor="middle" font-size="10" fill="#6b6558">程式內容都看得到</text>
  </g>

  <line x1="230" y1="143" x2="256" y2="143" stroke="#2a2620" stroke-width="1.8" marker-end="url(#arrowMain)"/>
  <line x1="460" y1="143" x2="491" y2="143" stroke="#2a2620" stroke-width="1.8" marker-end="url(#arrowMain)"/>
  <line x1="750" y1="143" x2="781" y2="143" stroke="#2a2620" stroke-width="1.8" marker-end="url(#arrowMain)"/>

  <!-- missing-token branch -->
  <line x1="628" y1="204" x2="628" y2="232" stroke="#b9782e" stroke-width="1.6" marker-end="url(#arrowWarn)"/>
  <rect x="428" y="236" width="400" height="90" rx="12" fill="#f1e2c8" stroke="#b9782e"/>
  <text x="628" y="260" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="13.5" font-weight="700" fill="#b9782e">還沒有通行證怎麼辦？</text>
  <text x="628" y="280" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="11" fill="#b9782e">跟負責的人申請一組屬於你自己、</text>
  <text x="628" y="298" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="11" fill="#b9782e">「只能看、不能改」的通行證</text>
  <text x="628" y="315" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="10" fill="#b9782e" opacity="0.8">設定好之後才能開始使用</text>
</svg>
