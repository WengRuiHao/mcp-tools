<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" role="img" aria-label="你在用的 AI 同時可以打開 5 個工具：讀 Asana 票單、讀 SVN 規格文件、自動處理 Asana 票單全流程、操作 GitHub、讀寫 Word/Excel/PDF。這 5 個工具各自獨立運作，互相不知道對方存在；只有「自動處理 Asana 票單全流程」這個工具比較特別，它自己內部又另外開了一份「讀 Asana 票單」跟「讀 SVN 規格文件」來用，是完全獨立的第二份，不是借用最上面那兩份">
  <defs>
    <marker id="archArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a2620"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="480" fill="#f5f2ea"/>

  <g font-family="'Noto Sans TC',sans-serif">
    <!-- Host -->
    <rect x="400" y="20" width="320" height="50" rx="10" fill="none" stroke="#2a2620" stroke-width="1.4"/>
    <text x="560" y="45" text-anchor="middle" font-size="13" font-weight="700" fill="#2a2620">你在用的 AI</text>
    <text x="560" y="61" text-anchor="middle" font-family="'IBM Plex Mono','Noto Sans TC',sans-serif" font-size="9" fill="#6b6558">例如 Claude Code</text>

    <!-- 5 top-level tool boxes -->
    <rect x="20" y="140" width="190" height="58" rx="9" fill="#dbe9ea" stroke="#2b6777"/>
    <text x="115" y="163" text-anchor="middle" font-size="12.5" font-weight="700" fill="#17414c">讀 Asana 票單資料</text>
    <text x="115" y="180" text-anchor="middle" font-family="'IBM Plex Mono','Noto Sans TC',sans-serif" font-size="9.5" fill="#17414c" opacity="0.75">asana-mcp</text>

    <rect x="230" y="140" width="190" height="58" rx="9" fill="#f1e2c8" stroke="#b9782e"/>
    <text x="325" y="163" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a5a1f">讀 SVN 上的規格文件</text>
    <text x="325" y="180" text-anchor="middle" font-family="'IBM Plex Mono','Noto Sans TC',sans-serif" font-size="9.5" fill="#8a5a1f" opacity="0.75">svn-mcp</text>

    <rect x="440" y="140" width="190" height="58" rx="9" fill="#dfe9dd" stroke="#4c7a52" stroke-width="1.6"/>
    <text x="535" y="163" text-anchor="middle" font-size="12" font-weight="700" fill="#365f3b">自動處理 Asana 票單</text>
    <text x="535" y="180" text-anchor="middle" font-family="'IBM Plex Mono','Noto Sans TC',sans-serif" font-size="9.5" fill="#365f3b" opacity="0.8">dev-pipeline-mcp</text>

    <rect x="650" y="140" width="190" height="58" rx="9" fill="#f2dbd2" stroke="#a84b36"/>
    <text x="745" y="163" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7d3a29">操作 GitHub</text>
    <text x="745" y="180" text-anchor="middle" font-family="'IBM Plex Mono','Noto Sans TC',sans-serif" font-size="9.5" fill="#7d3a29" opacity="0.75">github-mcp</text>

    <rect x="860" y="140" width="190" height="58" rx="9" fill="#e8dced" stroke="#6b4e8a"/>
    <text x="955" y="163" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a3563">讀寫 Word／Excel／PDF</text>
    <text x="955" y="180" text-anchor="middle" font-family="'IBM Plex Mono','Noto Sans TC',sans-serif" font-size="9.5" fill="#4a3563" opacity="0.75">office-docs-mcp</text>

    <!-- host fan-out arrows -->
    <g stroke="#2a2620">
      <line x1="440" y1="70" x2="115" y2="136" marker-end="url(#archArrow)"/>
      <line x1="480" y1="70" x2="325" y2="136" marker-end="url(#archArrow)"/>
      <line x1="540" y1="70" x2="535" y2="136" marker-end="url(#archArrow)"/>
      <line x1="600" y1="70" x2="745" y2="136" marker-end="url(#archArrow)"/>
      <line x1="640" y1="70" x2="955" y2="136" marker-end="url(#archArrow)"/>
    </g>
    <text x="560" y="112" text-anchor="middle" font-size="11.5" fill="#6b6558">這 5 個工具各自獨立運作，互相不知道對方存在</text>

    <!-- github-mcp / office-docs-mcp note -->
    <text x="850" y="222" text-anchor="middle" font-size="10.5" fill="#6b6558">這兩個工具沒有被其他工具借用，AI 直接用</text>

    <!-- bridging container label -->
    <text x="535" y="222" text-anchor="middle" font-size="11.5" font-weight="700" fill="#365f3b">它自己內部又另外開了 2 份工具來用</text>
    <text x="535" y="236" text-anchor="middle" font-size="10.5" fill="#365f3b" opacity="0.85">是完全獨立的第二份，不是借用上面那兩份</text>

    <!-- bridging container -->
    <rect x="375" y="248" width="320" height="150" rx="10" fill="none" stroke="#4c7a52" stroke-opacity="0.5" stroke-dasharray="5 4"/>

    <rect x="410" y="300" width="120" height="54" rx="8" fill="#dbe9ea" stroke="#2b6777"/>
    <text x="470" y="320" text-anchor="middle" font-size="10.5" font-weight="700" fill="#17414c">讀 Asana 票單</text>
    <text x="470" y="335" text-anchor="middle" font-family="'IBM Plex Mono','Noto Sans TC',sans-serif" font-size="9" fill="#17414c" opacity="0.7">asana-mcp</text>

    <rect x="545" y="300" width="120" height="54" rx="8" fill="#f1e2c8" stroke="#b9782e"/>
    <text x="605" y="320" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8a5a1f">讀 SVN 規格</text>
    <text x="605" y="335" text-anchor="middle" font-family="'IBM Plex Mono','Noto Sans TC',sans-serif" font-size="9" fill="#8a5a1f" opacity="0.7">svn-mcp</text>

    <!-- bridging arrows from dev-pipeline-mcp -->
    <g stroke="#4c7a52">
      <line x1="500" y1="198" x2="470" y2="296" marker-end="url(#archArrow)"/>
      <line x1="570" y1="198" x2="605" y2="296" marker-end="url(#archArrow)"/>
    </g>

    <!-- external systems note -->
    <rect x="20" y="420" width="1080" height="46" rx="8" fill="#e3dcc9" fill-opacity="0.5" stroke="#2a2620" stroke-opacity="0.35"/>
    <text x="560" y="440" text-anchor="middle" font-size="11" fill="#6b6558">最後都會連到真正的系統：Asana 網站　·　公司內部 SVN 版控　·　你的專案程式碼目錄</text>
    <text x="560" y="456" text-anchor="middle" font-size="11" fill="#6b6558">GitHub 網站　·　本機的 Word／Excel／PDF 處理程式</text>
  </g>
</svg>
