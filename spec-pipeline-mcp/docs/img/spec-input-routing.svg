<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" role="img" aria-label="load_spec 的分流邏輯：docx 直接轉 markitdown 進分析師，跳過版控檢查；md 檔案先看是否已被 git 追蹤，已追蹤就直接抓 commit 記錄，未追蹤但先前登記過對應目錄就用登記的目錄抓 commit，未追蹤也未登記則反問使用者、呼叫 register_git_dir 登記後再抓 commit；四條路徑最終都匯入分析師階段">
  <defs>
    <marker id="arrowRoute" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a2620"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="380" fill="#f5f2ea"/>

  <g font-family="'IBM Plex Mono','Noto Sans TC',sans-serif" font-size="12.5" text-anchor="middle">
    <rect x="20" y="165" width="150" height="56" rx="10" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
    <text x="95" y="189" fill="#2a2620">load_spec</text>
    <text x="95" y="205" font-size="10.5" fill="#6b6558">(specPath)</text>
  </g>

  <line x1="170" y1="193" x2="205" y2="193" stroke="#2a2620"/>
  <line x1="205" y1="50" x2="205" y2="320" stroke="#2a2620" stroke-opacity="0.55"/>

  <g stroke="#2a2620">
    <line x1="205" y1="50" x2="246" y2="50" marker-end="url(#arrowRoute)"/>
    <line x1="205" y1="140" x2="246" y2="140" marker-end="url(#arrowRoute)"/>
    <line x1="205" y1="230" x2="246" y2="230" marker-end="url(#arrowRoute)"/>
    <line x1="205" y1="320" x2="246" y2="320" marker-end="url(#arrowRoute)"/>
  </g>

  <g font-family="'Noto Sans TC',sans-serif" font-size="11" fill="#6b6558">
    <text x="250" y="18">docx</text>
    <text x="250" y="108">md（已追蹤）</text>
    <text x="250" y="198">md（未追蹤，已登記）</text>
    <text x="250" y="288">md（未追蹤，未登記）</text>
  </g>

  <g font-family="'IBM Plex Mono','Noto Sans TC',sans-serif" font-size="12" text-anchor="middle">
    <rect x="250" y="25" width="170" height="50" rx="9" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
    <text x="335" y="46" font-family="'Noto Sans TC',sans-serif" fill="#2a2620">markitdown</text>
    <text x="335" y="63" font-family="'Noto Sans TC',sans-serif" fill="#2a2620">轉換成 md</text>

    <rect x="250" y="115" width="200" height="50" rx="9" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
    <text x="350" y="136" fill="#2a2620">get_recent_commits</text>
    <text x="350" y="153" font-size="10.5" fill="#6b6558">(gitDir)</text>

    <rect x="250" y="205" width="220" height="50" rx="9" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
    <text x="360" y="226" fill="#2a2620">get_recent_commits</text>
    <text x="360" y="243" font-size="10.5" fill="#6b6558">(registeredGitDir)</text>

    <rect x="250" y="295" width="190" height="50" rx="9" fill="#f2dbd2" stroke="#a84b36"/>
    <text x="345" y="314" font-family="'Noto Sans TC',sans-serif" fill="#a84b36">反問使用者 →</text>
    <text x="345" y="331" font-family="'Noto Sans TC',sans-serif" font-size="10.5" fill="#a84b36">register_git_dir</text>
  </g>

  <line x1="440" y1="320" x2="466" y2="320" stroke="#2a2620" marker-end="url(#arrowRoute)"/>
  <g font-family="'IBM Plex Mono',monospace" font-size="12" text-anchor="middle">
    <rect x="470" y="295" width="200" height="50" rx="9" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
    <text x="570" y="316" fill="#2a2620">get_recent_commits</text>
    <text x="570" y="333" font-size="10.5" fill="#6b6558">(gitDir)</text>
  </g>

  <g stroke="#2a2620">
    <line x1="420" y1="50" x2="916" y2="50" marker-end="url(#arrowRoute)"/>
    <line x1="450" y1="140" x2="916" y2="140" marker-end="url(#arrowRoute)"/>
    <line x1="470" y1="230" x2="916" y2="230" marker-end="url(#arrowRoute)"/>
    <line x1="670" y1="320" x2="916" y2="320" marker-end="url(#arrowRoute)"/>
  </g>

  <rect x="920" y="15" width="140" height="340" rx="14" fill="#dbe9ea" stroke="#2b6777"/>
  <text x="990" y="178" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="16" font-weight="700" fill="#17414c">分析師</text>
  <text x="990" y="198" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="10.5" fill="#17414c" opacity="0.85">get_role_prompt</text>
  <text x="990" y="212" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="10.5" fill="#17414c" opacity="0.85">(analyst)</text>
</svg>
