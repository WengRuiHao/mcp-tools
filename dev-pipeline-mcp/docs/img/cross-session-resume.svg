<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" role="img" aria-label="換人或換新對話接手怎麼銜接：所有進度都存在硬碟上的追蹤檔案，不是活在對話記憶裡。接手的AI會先看濃縮過的重點摘要，成本低、速度快；只有摘要不夠用時，才去讀完整內容，成本比較高">
  <defs>
    <marker id="arrowCheap" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6777"/>
    </marker>
    <marker id="arrowCostly" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b9782e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="260" fill="#f5f2ea"/>

  <rect x="24" y="30" width="300" height="200" rx="12" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.8"/>
  <text x="174" y="54" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-weight="700" font-size="13" fill="#2a2620">硬碟上的追蹤紀錄</text>

  <rect x="44" y="70" width="260" height="46" rx="8" fill="#dbe9ea" stroke="#2b6777"/>
  <text x="174" y="90" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="12.5" font-weight="700" fill="#17414c">📝 重點摘要</text>
  <text x="174" y="105" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="10.5" fill="#17414c" opacity="0.85">2–4 條重點，體積小</text>

  <rect x="44" y="126" width="260" height="86" rx="8" fill="#f1e2c8" stroke="#b9782e"/>
  <text x="174" y="148" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="12.5" font-weight="700" fill="#b9782e">📄 完整內容</text>
  <text x="174" y="166" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="10.5" fill="#b9782e" opacity="0.9">分析／實作／驗證全文</text>
  <text x="174" y="182" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="10.5" fill="#b9782e" opacity="0.9">連票單原文、留言都在</text>
  <text x="174" y="200" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="10" fill="#b9782e" opacity="0.75">篇幅較大，需要才讀</text>

  <rect x="620" y="70" width="336" height="120" rx="12" fill="none" stroke="#2a2620" stroke-opacity="0.85"/>
  <text x="788" y="98" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-weight="700" font-size="13" fill="#2a2620">接手的人／AI</text>
  <text x="788" y="118" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="11.5" fill="#6b6558">不管是不是原來那個對話，</text>
  <text x="788" y="134" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="11.5" fill="#6b6558">一律先假設要重新確認進度</text>

  <line x1="304" y1="93" x2="614" y2="105" stroke="#2b6777" stroke-width="2" marker-end="url(#arrowCheap)"/>
  <text x="460" y="80" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="12" fill="#17414c" font-weight="500">① 先看摘要（快，預設這樣做）</text>

  <line x1="304" y1="168" x2="614" y2="150" stroke="#b9782e" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrowCostly)"/>
  <text x="460" y="238" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="12" fill="#b9782e" font-weight="500">② 摘要不夠用，才讀完整內容（比較慢）</text>
</svg>
