<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="每次執行的主要流程，四個步驟：先設定一次、列出待處理的票單、一張一張票依序處理（分析、寫程式碼、驗證），全部做完後整理報告給使用者；列票單的時候如果有舊票還在等使用者自己確認，也會一併主動提醒">
  <defs>
    <marker id="arrowMain" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a2620"/>
    </marker>
    <marker id="arrowMainAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6777"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b9782e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="330" fill="#f5f2ea"/>

  <g font-family="'Noto Sans TC',sans-serif">
    <!-- step 1 -->
    <rect x="15" y="100" width="220" height="80" rx="12" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
    <circle cx="40" cy="118" r="13" fill="#2a2620"/>
    <text x="40" y="123" text-anchor="middle" fill="#f5f2ea" font-weight="700" font-size="13">1</text>
    <text x="125" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#2a2620">先設定一次</text>
    <text x="125" y="158" text-anchor="middle" font-size="10.5" fill="#6b6558">哪個 Asana 專案、程式碼在哪</text>

    <!-- step 2 -->
    <rect x="265" y="100" width="220" height="80" rx="12" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
    <circle cx="290" cy="118" r="13" fill="#2a2620"/>
    <text x="290" y="123" text-anchor="middle" fill="#f5f2ea" font-weight="700" font-size="13">2</text>
    <text x="375" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#2a2620">列出待處理的票</text>
    <text x="375" y="158" text-anchor="middle" font-family="'IBM Plex Mono',sans-serif" font-size="10" fill="#6b6558">list_pending_tickets</text>

    <!-- step 3 (accent, wider) -->
    <rect x="515" y="88" width="240" height="104" rx="12" fill="#dbe9ea" stroke="#2b6777"/>
    <circle cx="540" cy="106" r="13" fill="#17414c"/>
    <text x="540" y="111" text-anchor="middle" fill="#dbe9ea" font-weight="700" font-size="13">3</text>
    <text x="635" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#17414c">一張一張票處理</text>
    <text x="635" y="150" text-anchor="middle" font-size="11.5" fill="#17414c">分析 → 寫程式碼 → 驗證</text>
    <text x="635" y="168" text-anchor="middle" font-size="10.5" fill="#17414c" opacity="0.8">（詳細步驟見下一張圖）</text>

    <!-- step 4 -->
    <rect x="765" y="100" width="220" height="80" rx="12" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
    <circle cx="790" cy="118" r="13" fill="#2a2620"/>
    <text x="790" y="123" text-anchor="middle" fill="#f5f2ea" font-weight="700" font-size="13">4</text>
    <text x="875" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#2a2620">整理報告給你</text>
    <text x="875" y="158" text-anchor="middle" font-size="10.5" fill="#6b6558">還沒 push，交你自己決定</text>
  </g>

  <line x1="235" y1="140" x2="261" y2="140" stroke="#2a2620" stroke-width="1.8" marker-end="url(#arrowMain)"/>
  <line x1="485" y1="140" x2="511" y2="140" stroke="#2a2620" stroke-width="1.8" marker-end="url(#arrowMain)"/>
  <line x1="755" y1="140" x2="761" y2="140" stroke="#2a2620" stroke-width="1.8" marker-end="url(#arrowMain)"/>

  <path d="M 700 88 C 700 40, 550 40, 550 88" fill="none" stroke="#2b6777" stroke-width="1.6" marker-end="url(#arrowMainAccent)"/>
  <text x="625" y="34" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="12" fill="#17414c">清單裡還有下一張票 → 重複步驟 3</text>

  <!-- awaitingConfirmation branch -->
  <line x1="375" y1="180" x2="375" y2="212" stroke="#b9782e" stroke-width="1.6" marker-end="url(#arrowWarn)"/>
  <rect x="215" y="216" width="320" height="94" rx="12" fill="#f1e2c8" stroke="#b9782e"/>
  <text x="375" y="240" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="13.5" font-weight="700" fill="#b9782e">順便提醒：還有舊票在等你</text>
  <text x="375" y="260" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="11" fill="#b9782e">AI 之前已經做完、但你自己還沒</text>
  <text x="375" y="278" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="11" fill="#b9782e">實際測過＋看過程式碼的票</text>
  <text x="375" y="298" text-anchor="middle" font-family="'IBM Plex Mono',sans-serif" font-size="9.5" fill="#b9782e" opacity="0.8">awaitingConfirmation</text>
</svg>
