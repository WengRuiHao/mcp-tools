<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="分析、實作、驗證三份紀錄怎麼保持同步：AI寫實作紀錄時，一定要交代這次有沒有推翻分析紀錄的結論；沒有的話只做個記號代表核對過；有推翻的話，AI會自動把新發現補寫回分析紀錄，不會漏掉。如果之後分析紀錄又被單獨改過，這個核對記號會失效，下次寫實作紀錄要重新核對一次。驗證紀錄對實作紀錄也套用同樣的機制">
  <defs>
    <marker id="arrowNeutral2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a2620"/>
    </marker>
    <marker id="arrowAccent2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6777"/>
    </marker>
    <marker id="arrowStale2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a84b36"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="470" fill="#f5f2ea"/>

  <g font-family="'Noto Sans TC',sans-serif">
    <!-- row 1: three documents -->
    <rect x="20" y="20" width="180" height="54" rx="9" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
    <text x="110" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#2a2620">分析紀錄</text>
    <text x="110" y="63" text-anchor="middle" font-family="'IBM Plex Mono',sans-serif" font-size="9.5" fill="#6b6558">01-analysis.md</text>

    <rect x="390" y="20" width="220" height="54" rx="9" fill="#dbe9ea" stroke="#2b6777"/>
    <text x="500" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#17414c">實作紀錄</text>
    <text x="500" y="63" text-anchor="middle" font-family="'IBM Plex Mono',sans-serif" font-size="9.5" fill="#17414c">02-implementation.md</text>

    <rect x="800" y="20" width="180" height="54" rx="9" fill="none" stroke="#2a2620" stroke-opacity="0.45" stroke-dasharray="4 4"/>
    <text x="890" y="46" text-anchor="middle" font-size="13" fill="#2a2620" opacity="0.55">驗證紀錄</text>
    <text x="890" y="63" text-anchor="middle" font-family="'IBM Plex Mono',sans-serif" font-size="9.5" fill="#2a2620" opacity="0.5">03-verification.md</text>

    <line x1="610" y1="47" x2="794" y2="47" stroke="#2a2620" stroke-opacity="0.45" stroke-dasharray="4 4" marker-end="url(#arrowNeutral2)"/>
    <text x="702" y="34" text-anchor="middle" font-size="11" fill="#6b6558">驗證紀錄對實作紀錄套用同樣機制</text>

    <line x1="500" y1="74" x2="500" y2="97" stroke="#2a2620" marker-end="url(#arrowNeutral2)"/>

    <!-- decision diamond -->
    <polygon points="500,97 583,145 500,193 417,145" fill="#dbe9ea" stroke="#2b6777" stroke-width="1.4"/>
    <text x="500" y="136" text-anchor="middle" font-size="11.5" font-weight="700" fill="#17414c">有沒有推翻</text>
    <text x="500" y="152" text-anchor="middle" font-size="11.5" font-weight="700" fill="#17414c">前面的結論？</text>

    <line x1="417" y1="145" x2="284" y2="221" stroke="#2a2620" marker-end="url(#arrowNeutral2)"/>
    <line x1="583" y1="145" x2="716" y2="221" stroke="#2b6777" marker-end="url(#arrowAccent2)"/>

    <!-- branch A: no reversal -->
    <rect x="140" y="225" width="260" height="78" rx="9" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
    <text x="270" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#2a2620">沒有，維持原樣</text>
    <text x="270" y="268" text-anchor="middle" font-size="11" fill="#6b6558">做個記號，代表已經核對過</text>
    <text x="270" y="286" text-anchor="middle" font-family="'IBM Plex Mono',sans-serif" font-size="9" fill="#6b6558" opacity="0.8">"NO_SYNC_NEEDED"</text>

    <!-- branch B: reversed -->
    <rect x="560" y="225" width="300" height="78" rx="9" fill="#dbe9ea" stroke="#2b6777"/>
    <text x="710" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#17414c">有，推翻了之前的結論</text>
    <text x="710" y="268" text-anchor="middle" font-size="11" fill="#17414c" opacity="0.9">自動把新發現補寫回「分析紀錄」</text>
    <text x="710" y="286" text-anchor="middle" font-size="10.5" fill="#17414c" opacity="0.8">不會漏掉、不用你提醒</text>

    <!-- convergence -->
    <line x1="290" y1="303" x2="400" y2="343" stroke="#2a2620" marker-end="url(#arrowNeutral2)"/>
    <line x1="700" y1="303" x2="600" y2="343" stroke="#2a2620" marker-end="url(#arrowNeutral2)"/>

    <rect x="310" y="345" width="380" height="50" rx="9" fill="none" stroke="#2a2620" stroke-opacity="0.8"/>
    <text x="500" y="368" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2a2620">做好記號：這次已經核對過了</text>
    <text x="500" y="386" text-anchor="middle" font-size="11" font-weight="500" fill="#4c7a52">分析紀錄暫時不會被標記為「過期」</text>

    <!-- drift / stale scenario -->
    <path d="M 110 74 C 55 210, 55 340, 110 405" fill="none" stroke="#a84b36" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrowStale2)"/>

    <rect x="20" y="410" width="320" height="50" rx="9" fill="#f2dbd2" stroke="#a84b36"/>
    <text x="180" y="430" text-anchor="middle" font-size="11.5" fill="#a84b36">如果之後「分析紀錄」又被單獨改過</text>
    <text x="180" y="448" text-anchor="middle" font-size="11.5" font-weight="500" fill="#a84b36">→ 這個記號失效，下次要重新核對</text>
  </g>
</svg>
