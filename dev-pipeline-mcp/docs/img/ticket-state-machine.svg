<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" role="img" aria-label="一張票單會依序經過六個階段：剛收到票、抓票單內容、確認程式碼位置、AI分析問題、AI寫程式碼、AI驗證結果，只會往前走不會跳過。只有AI自己維護規格文件的專案，分析完之後會多一步：AI先寫規格草稿讓使用者確認，確認過才能繼續寫程式碼。驗證結果如果沒通過，AI會自動回頭修正再重驗一次；如果通過，還要使用者自己實測並看過程式碼確認沒問題，才算真的完成，使用者發現有問題一樣會被送回去自動修正。如果Asana上的票單內容後來又被改過，AI會自動重新分析，不會用舊資料繼續">
  <defs>
    <marker id="arrowStage" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a2620"/>
    </marker>
    <marker id="arrowSpec" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6f99"/>
    </marker>
    <marker id="arrowStale" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a84b36"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b9782e"/>
    </marker>
    <marker id="arrowGood" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c7a52"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="460" fill="#f5f2ea"/>

  <g font-family="'Noto Sans TC',sans-serif">
    <!-- conditional spec-draft note (only self-generated projects) -->
    <rect x="586" y="25" width="250" height="53" rx="9" fill="#e3e7f0" stroke="#5c6f99" stroke-dasharray="4 3"/>
    <text x="711" y="44" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5c6f99">有些專案：AI 先寫規格草稿</text>
    <text x="711" y="60" text-anchor="middle" font-size="10.5" fill="#5c6f99">等你確認過才能繼續寫程式碼</text>
    <text x="711" y="74" text-anchor="middle" font-size="9" fill="#5c6f99" opacity="0.75">（只有 AI 自己維護規格的專案才會這樣）</text>
    <line x1="711" y1="78" x2="711" y2="97" stroke="#5c6f99" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowSpec)"/>

    <!-- content-changed warning tag above verified -->
    <rect x="858" y="25" width="200" height="53" rx="9" fill="#f2dbd2" stroke="#a84b36" stroke-dasharray="4 3"/>
    <text x="958" y="44" text-anchor="middle" font-size="10.5" font-weight="700" fill="#a84b36">⚠ 票單內容後來又變了？</text>
    <text x="958" y="60" text-anchor="middle" font-size="10.5" fill="#a84b36">AI 會自動重新分析，不用你說</text>
    <text x="958" y="74" text-anchor="middle" font-size="9" fill="#a84b36" opacity="0.75">（不會沿用舊資料繼續做）</text>
    <line x1="958" y1="78" x2="975" y2="97" stroke="#a84b36" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowStale)"/>

    <!-- main row: 6 step cards -->
    <g font-size="13" text-anchor="middle">
      <rect x="20" y="100" width="150" height="80" rx="10" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
      <circle cx="42" cy="116" r="12" fill="#2a2620"/><text x="42" y="120" fill="#f5f2ea" font-weight="700" font-size="11">1</text>
      <text x="95" y="140" font-weight="700" fill="#2a2620">剛收到票</text>
      <text x="95" y="158" font-family="'IBM Plex Mono',sans-serif" font-size="9.5" fill="#6b6558">new</text>

      <rect x="196" y="100" width="150" height="80" rx="10" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
      <circle cx="218" cy="116" r="12" fill="#2a2620"/><text x="218" y="120" fill="#f5f2ea" font-weight="700" font-size="11">2</text>
      <text x="271" y="140" font-weight="700" fill="#2a2620">抓票單內容</text>
      <text x="271" y="158" font-family="'IBM Plex Mono',sans-serif" font-size="9.5" fill="#6b6558">snapshot</text>

      <rect x="372" y="100" width="150" height="80" rx="10" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
      <circle cx="394" cy="116" r="12" fill="#2a2620"/><text x="394" y="120" fill="#f5f2ea" font-weight="700" font-size="11">3</text>
      <text x="447" y="134" font-weight="700" fill="#2a2620">確認程式碼</text>
      <text x="447" y="150" font-weight="700" fill="#2a2620">位置</text>
      <text x="447" y="166" font-family="'IBM Plex Mono',sans-serif" font-size="8.5" fill="#6b6558">project_dir_confirmed</text>

      <rect x="548" y="100" width="150" height="80" rx="10" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
      <circle cx="570" cy="116" r="12" fill="#2a2620"/><text x="570" y="120" fill="#f5f2ea" font-weight="700" font-size="11">4</text>
      <text x="623" y="140" font-weight="700" fill="#2a2620">AI 分析問題</text>
      <text x="623" y="158" font-family="'IBM Plex Mono',sans-serif" font-size="9.5" fill="#6b6558">analyzed</text>

      <rect x="724" y="100" width="150" height="80" rx="10" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
      <circle cx="746" cy="116" r="12" fill="#2a2620"/><text x="746" y="120" fill="#f5f2ea" font-weight="700" font-size="11">5</text>
      <text x="799" y="140" font-weight="700" fill="#2a2620">AI 寫程式碼</text>
      <text x="799" y="158" font-family="'IBM Plex Mono',sans-serif" font-size="9.5" fill="#6b6558">implemented</text>

      <rect x="900" y="100" width="150" height="80" rx="10" fill="#dfe9dd" stroke="#4c7a52"/>
      <circle cx="922" cy="116" r="12" fill="#4c7a52"/><text x="922" y="120" fill="#f5f2ea" font-weight="700" font-size="11">6</text>
      <text x="975" y="140" font-weight="700" fill="#4c7a52">AI 驗證結果</text>
      <text x="975" y="158" font-family="'IBM Plex Mono',sans-serif" font-size="9.5" fill="#4c7a52">verified</text>
    </g>
  </g>

  <g stroke="#2a2620">
    <line x1="170" y1="140" x2="192" y2="140" marker-end="url(#arrowStage)"/>
    <line x1="346" y1="140" x2="368" y2="140" marker-end="url(#arrowStage)"/>
    <line x1="522" y1="140" x2="544" y2="140" marker-end="url(#arrowStage)"/>
    <line x1="698" y1="140" x2="720" y2="140" marker-end="url(#arrowStage)"/>
    <line x1="874" y1="140" x2="896" y2="140" marker-end="url(#arrowStage)"/>
  </g>

  <!-- outcome: FAIL → auto-retry -->
  <path d="M 900 165 L 800 195 L 200 195 L 200 220" fill="none" stroke="#a84b36" stroke-width="1.6" marker-end="url(#arrowStale)"/>
  <rect x="60" y="224" width="600" height="100" rx="10" fill="#f2dbd2" stroke="#a84b36"/>
  <text x="360" y="248" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="13.5" font-weight="700" fill="#a84b36">😕 沒通過 → AI 自動回頭修，不用你操心</text>
  <text x="360" y="268" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="11" fill="#a84b36">問題出在「分析方向」就回步驟 4 重新分析；出在「寫的程式碼」就回步驟 5 重寫</text>
  <text x="360" y="286" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="11" font-weight="500" fill="#a84b36">同一張票連續失敗 3 次以上，AI 才會停下來問你</text>
  <text x="360" y="306" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="10.5" fill="#a84b36" opacity="0.85">你自己測試後回報「有問題」，也會走同一套自動修正流程</text>

  <!-- outcome: PASS → 待確認 → 已完成 -->
  <line x1="975" y1="180" x2="975" y2="220" stroke="#b9782e" stroke-width="1.6" marker-end="url(#arrowWarn)"/>
  <rect x="855" y="224" width="210" height="86" rx="10" fill="#f1e2c8" stroke="#b9782e"/>
  <text x="960" y="246" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="13" font-weight="700" fill="#b9782e">🙂 AI 覺得通過了</text>
  <text x="960" y="264" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="11" fill="#b9782e">但還要你自己實測、</text>
  <text x="960" y="280" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="11" fill="#b9782e">看過程式碼才算數</text>
  <text x="960" y="298" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="9.5" fill="#b9782e" opacity="0.8">你說「有問題」→ 走上面自動修正流程</text>

  <line x1="960" y1="310" x2="960" y2="340" stroke="#4c7a52" stroke-width="1.6" marker-end="url(#arrowGood)"/>
  <rect x="885" y="344" width="150" height="54" rx="10" fill="#dfe9dd" stroke="#4c7a52"/>
  <text x="960" y="366" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="13" font-weight="700" fill="#4c7a52">✅ 真的完成了</text>
  <text x="960" y="384" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="10" fill="#4c7a52">你確認過沒問題</text>

  <text x="360" y="345" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="11" fill="#6b6558">（左邊「規格草稿」那一步：你打回意見的話，AI 改完會重新請你確認一次，不會跳過）</text>
</svg>
