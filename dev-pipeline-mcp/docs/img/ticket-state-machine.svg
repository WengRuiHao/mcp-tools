<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" role="img" aria-label="一張票單會依序經過七個階段：剛收到票、抓票單內容、確認程式碼位置、AI分析問題、AI寫程式碼、AI驗證結果、AI測試情境，只會往前走不會跳過。只有AI自己維護規格文件的專案，會多一步規格草稿確認：依專案設定，這一步發生在AI分析問題之後、AI寫程式碼之前（先規格後程式碼），或是AI寫程式碼之後、AI驗證結果之前（先程式碼後反推規格），確認過才能繼續往下走。驗證結果或測試情境任一步沒通過，AI會自動回頭修正再重驗一次；測試情境裡AI沒把握精確判定的項目不算沒通過，只會列進待你確認的清單。全部通過後，還要使用者自己實測並看過程式碼確認沒問題，才算真的完成，使用者發現有問題一樣會被送回去自動修正。如果Asana上的票單內容後來又被改過，AI會自動重新分析，不會用舊資料繼續">
  <defs>
    <marker id="arrowStage" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a2620"/>
    </marker>
    <marker id="arrowSpec" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6f99"/>
    </marker>
    <marker id="arrowStale" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a84b36"/>
    </marker>
    <marker id="arrowWarn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b9782e"/>
    </marker>
    <marker id="arrowGood" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c7a52"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="470" fill="#f5f2ea"/>

  <g font-family="'Noto Sans TC',sans-serif">
    <!-- conditional spec-draft note (only self-generated projects) -->
    <rect x="481" y="25" width="210" height="53" rx="9" fill="#e3e7f0" stroke="#5c6f99" stroke-dasharray="4 3"/>
    <text x="586" y="42" text-anchor="middle" font-size="10" font-weight="700" fill="#5c6f99">有些專案：AI 會多寫</text>
    <text x="586" y="56" text-anchor="middle" font-size="10" font-weight="700" fill="#5c6f99">一份規格草稿，等你確認</text>
    <text x="586" y="70" text-anchor="middle" font-size="8.5" fill="#5c6f99" opacity="0.75">（依設定，發生在寫程式碼前或後）</text>
    <line x1="586" y1="78" x2="586" y2="97" stroke="#5c6f99" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowSpec)"/>

    <!-- content-changed warning tag above verified -->
    <rect x="717" y="25" width="170" height="53" rx="9" fill="#f2dbd2" stroke="#a84b36" stroke-dasharray="4 3"/>
    <text x="802" y="42" text-anchor="middle" font-size="10" font-weight="700" fill="#a84b36">⚠ 票單內容變了？</text>
    <text x="802" y="56" text-anchor="middle" font-size="10" fill="#a84b36">AI 會自動重新分析</text>
    <text x="802" y="70" text-anchor="middle" font-size="8.5" fill="#a84b36" opacity="0.75">（不會沿用舊資料繼續做）</text>
    <line x1="802" y1="78" x2="802" y2="97" stroke="#a84b36" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowStale)"/>

    <!-- main row: 7 step cards -->
    <g font-size="12.5" text-anchor="middle">
      <rect x="20" y="100" width="124" height="80" rx="10" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
      <circle cx="40" cy="116" r="12" fill="#2a2620"/><text x="40" y="120" fill="#f5f2ea" font-weight="700" font-size="11">1</text>
      <text x="82" y="140" font-weight="700" fill="#2a2620">剛收到票</text>
      <text x="82" y="158" font-family="'IBM Plex Mono',sans-serif" font-size="9" fill="#6b6558">new</text>

      <rect x="164" y="100" width="124" height="80" rx="10" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
      <circle cx="184" cy="116" r="12" fill="#2a2620"/><text x="184" y="120" fill="#f5f2ea" font-weight="700" font-size="11">2</text>
      <text x="226" y="140" font-weight="700" fill="#2a2620">抓票單內容</text>
      <text x="226" y="158" font-family="'IBM Plex Mono',sans-serif" font-size="9" fill="#6b6558">snapshot</text>

      <rect x="308" y="100" width="124" height="80" rx="10" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
      <circle cx="328" cy="116" r="12" fill="#2a2620"/><text x="328" y="120" fill="#f5f2ea" font-weight="700" font-size="11">3</text>
      <text x="370" y="134" font-weight="700" fill="#2a2620">確認程式碼</text>
      <text x="370" y="150" font-weight="700" fill="#2a2620">位置</text>
      <text x="370" y="166" font-family="'IBM Plex Mono',sans-serif" font-size="8" fill="#6b6558">project_dir_confirmed</text>

      <rect x="452" y="100" width="124" height="80" rx="10" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
      <circle cx="472" cy="116" r="12" fill="#2a2620"/><text x="472" y="120" fill="#f5f2ea" font-weight="700" font-size="11">4</text>
      <text x="514" y="140" font-weight="700" fill="#2a2620">AI 分析問題</text>
      <text x="514" y="158" font-family="'IBM Plex Mono',sans-serif" font-size="9" fill="#6b6558">analyzed</text>

      <rect x="596" y="100" width="124" height="80" rx="10" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
      <circle cx="616" cy="116" r="12" fill="#2a2620"/><text x="616" y="120" fill="#f5f2ea" font-weight="700" font-size="11">5</text>
      <text x="658" y="140" font-weight="700" fill="#2a2620">AI 寫程式碼</text>
      <text x="658" y="158" font-family="'IBM Plex Mono',sans-serif" font-size="9" fill="#6b6558">implemented</text>

      <rect x="740" y="100" width="124" height="80" rx="10" fill="#e3dcc9" stroke="#2a2620" stroke-opacity="0.85"/>
      <circle cx="760" cy="116" r="12" fill="#2a2620"/><text x="760" y="120" fill="#f5f2ea" font-weight="700" font-size="11">6</text>
      <text x="802" y="140" font-weight="700" fill="#2a2620">AI 驗證結果</text>
      <text x="802" y="158" font-family="'IBM Plex Mono',sans-serif" font-size="9" fill="#6b6558">verified</text>

      <rect x="884" y="100" width="124" height="80" rx="10" fill="#dfe9dd" stroke="#4c7a52"/>
      <circle cx="904" cy="116" r="12" fill="#4c7a52"/><text x="904" y="120" fill="#f5f2ea" font-weight="700" font-size="11">7</text>
      <text x="946" y="140" font-weight="700" fill="#4c7a52">AI 測試情境</text>
      <text x="946" y="158" font-family="'IBM Plex Mono',sans-serif" font-size="9" fill="#4c7a52">tested</text>
    </g>
  </g>

  <g stroke="#2a2620">
    <line x1="144" y1="140" x2="160" y2="140" marker-end="url(#arrowStage)"/>
    <line x1="288" y1="140" x2="304" y2="140" marker-end="url(#arrowStage)"/>
    <line x1="432" y1="140" x2="448" y2="140" marker-end="url(#arrowStage)"/>
    <line x1="576" y1="140" x2="592" y2="140" marker-end="url(#arrowStage)"/>
    <line x1="720" y1="140" x2="736" y2="140" marker-end="url(#arrowStage)"/>
    <line x1="864" y1="140" x2="880" y2="140" marker-end="url(#arrowStage)"/>
  </g>

  <!-- outcome: FAIL (either step 6 verified or step 7 tested) → auto-retry -->
  <path d="M 802 180 L 802 206 L 300 206 L 300 220" fill="none" stroke="#a84b36" stroke-width="1.6" marker-end="url(#arrowStale)"/>
  <path d="M 946 180 L 946 213 L 520 213 L 520 220" fill="none" stroke="#a84b36" stroke-width="1.6" marker-end="url(#arrowStale)"/>
  <rect x="60" y="224" width="600" height="112" rx="10" fill="#f2dbd2" stroke="#a84b36"/>
  <text x="360" y="248" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="13.5" font-weight="700" fill="#a84b36">😕 步驟 6 或 7 沒通過 → AI 自動回頭修，不用你操心</text>
  <text x="360" y="268" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="11" fill="#a84b36">問題出在「分析方向」就回步驟 4 重新分析；出在「寫的程式碼」就回步驟 5 重寫</text>
  <text x="360" y="286" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="11" font-weight="500" fill="#a84b36">同一張票連續失敗 3 次以上，AI 才會停下來問你</text>
  <text x="360" y="304" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="10.5" fill="#a84b36" opacity="0.85">你自己測試後回報「有問題」，也會走同一套自動修正流程</text>
  <text x="360" y="322" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="10.5" fill="#a84b36" opacity="0.85">步驟 7 沒把握精確判定的項目不算沒通過，只會列進下面的待確認清單</text>

  <!-- outcome: 步驟7 PASS → 待確認 → 已完成 -->
  <line x1="946" y1="180" x2="946" y2="220" stroke="#b9782e" stroke-width="1.6" marker-end="url(#arrowWarn)"/>
  <rect x="841" y="224" width="210" height="98" rx="10" fill="#f1e2c8" stroke="#b9782e"/>
  <text x="946" y="246" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="13" font-weight="700" fill="#b9782e">🙂 AI 都覺得通過了</text>
  <text x="946" y="264" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="11" fill="#b9782e">但還要你自己實測、</text>
  <text x="946" y="280" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="11" fill="#b9782e">看過程式碼才算數</text>
  <text x="946" y="296" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="9.5" fill="#b9782e" opacity="0.85">附上步驟 7 列的待人工確認項目</text>
  <text x="946" y="311" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="9.5" fill="#b9782e" opacity="0.8">你說「有問題」→ 走上面自動修正流程</text>

  <line x1="946" y1="322" x2="946" y2="352" stroke="#4c7a52" stroke-width="1.6" marker-end="url(#arrowGood)"/>
  <rect x="871" y="356" width="150" height="54" rx="10" fill="#dfe9dd" stroke="#4c7a52"/>
  <text x="946" y="378" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="13" font-weight="700" fill="#4c7a52">✅ 真的完成了</text>
  <text x="946" y="396" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="10" fill="#4c7a52">你確認過沒問題</text>

  <text x="360" y="357" text-anchor="middle" font-family="'Noto Sans TC',sans-serif" font-size="11" fill="#6b6558">（規格草稿那一步：你打回意見的話，AI 會重新請你確認一次；有些專案這一步改在「寫程式碼」之後才出現，一樣不會跳過）</text>
</svg>
